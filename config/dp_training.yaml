defaults:
  - task: food_scoop

trial_name: "1222"
img_type: "rgb"
camera_view: 
  mode: "single" # multi
  direction: "back" # front
proprioception: True
guidance: True
validation: False

data:
  rootPath: '/media/hcis-s22/data/isaaclab_dp_split_dataset'
  food_item: ['brl', 'brm', 'brh', 
              'col', 'com', 'coh', 
              'jul', 'jum', 'juh', 
              'mbl', 'mbm', 'mbh', 
              'syl', 'sym', 'syh'
              ]
  trial_num: 5

train_dataloader:
  batch_size: 64
  num_workers: 8

val_dataloader:
  batch_size: 1
  num_workers: 8

test_dataloader:
  batch_size: 1
  num_workers: 8

horizon: 16
n_obs_steps: 5
n_action_steps: 12
num_train_timesteps: 100
num_inference_steps: 16

data_preprocess:
  in_dir : "/media/hcis-s22/data/isaaclab_dp_dataset"
  out_dir: "/media/hcis-s22/data/isaaclab_dp_split_dataset"

training:
  device: "cuda:0"
  num_epochs: 1000
  gradient_accumulate_every: 1
  lr: 0.0001
  lr_warmup_steps: 500
  num_cycles: 1
  save_epoch: 100
  

testing:
  device: "cuda:0"
  guided_weight: 3.
  goal_guided:
    mode: "sum_all_frame_weighted"
    weight: 1.0
  spillage_guided:
    mode: "mean"
    weight: 1.0
  quatity_guided:
    mode: "AE"
    weight: 1.0
